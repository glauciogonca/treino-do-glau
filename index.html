<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6F4F0">
<title>Treino do Glau</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino do Glau">
<meta name="description" content="Registro de treino do Ciclo 1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#F6F4F0; --card:#FFFFFF; --card2:#F0EDE7; --line:#E3DED4; --line2:#D3CCC0;
  --ink:#15181C; --muted:#6E6A63; --dim:#9A948B;
  --pine:#1D5E4F; --pine-bg:#E4EFEA; --pine-line:#B9D6CB;
  --rust:#B4472C; --rust-bg:#FAE9E3; --rust-line:#E8C3B6;
  --gold:#8C6318; --gold-bg:#F7EEDA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);max-width:100%}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.aba,.tick,.ok,.m,.dia,.stat b,.stat span{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:660px;margin:0 auto;padding:0 0 100px;min-height:100vh;overflow-x:clip}
button{font-family:inherit}

.topo{position:fixed;top:0;left:0;right:0;max-width:660px;margin:0 auto;z-index:30;background:rgba(246,244,240,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topo-in{display:flex;align-items:center;justify-content:space-between;padding:13px 18px 11px}
.topo h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.relogio{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;color:var(--pine);background:var(--pine-bg);border:1px solid var(--pine-line);border-radius:8px;padding:5px 10px;display:none}
.relogio.on{display:flex;align-items:center;gap:6px;cursor:pointer}
.relogio .pi{width:11px;height:12px;display:inline-block;flex:none;box-sizing:border-box}
.relogio .pi{border-left:3.5px solid currentColor;border-right:3.5px solid currentColor}
.relogio.pausado{color:var(--rust);background:var(--rust-bg);border-color:var(--rust-line)}
.relogio.pausado .pi{width:0;height:0;border-left:9px solid currentColor;border-right:0;border-top:6px solid transparent;border-bottom:6px solid transparent}
.estimativa{margin:11px 18px 0;display:flex;gap:7px;flex-wrap:wrap}
.estimativa span{font-family:"JetBrains Mono",monospace;font-size:11px;background:var(--card2);border-radius:6px;padding:5px 9px;color:var(--muted)}
.estimativa span b{color:var(--ink);font-weight:700}
.abas{display:flex;gap:3px;padding:0 14px 9px}
.aba{flex:1;background:none;border:0;border-radius:9px;padding:8px 6px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.aba[aria-pressed="true"]{background:var(--ink);color:#fff}
.aba:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.alerta-db{margin:12px 18px 0;background:var(--rust-bg);border:1px solid var(--rust-line);border-radius:10px;padding:11px 13px;font-size:13px;color:#8A3520}
.alerta-db b{font-weight:700}

.sec{margin:22px 18px 0}
.sec>h2{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:0 0 10px}
.sec>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.sec>h2 .dur{color:var(--pine);letter-spacing:.08em}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px 16px}

.hero{background:var(--ink);color:#fff;border-radius:15px;padding:19px 18px;margin:16px 18px 0}
.hero .lab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#A9A399;margin:0 0 7px}
.hero h3{font-size:25px;font-weight:700;margin:0;letter-spacing:-.01em}
.hero p{color:#B9B3A9;font-size:13.5px;margin:6px 0 0}
.hero .btn{margin-top:15px;width:100%;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:13px;font-size:15.5px;font-weight:600;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 9px;text-align:center}
.stat b{display:block;font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;line-height:1.1}
.stat span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:4px}

.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{text-align:center;padding:9px 2px;border-radius:9px;background:var(--card2);border:1.5px solid transparent}
.dia .d{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--dim);text-transform:uppercase}
.dia .v{font-size:15px;font-weight:700;margin-top:3px;color:var(--dim)}
.dia.feito{background:var(--pine-bg)}
.dia.feito .v{color:var(--pine)}
.dia.hoje{border-color:var(--ink)}

.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .sel{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.hist .sel.pesado{background:var(--rust-bg);color:var(--rust)}
.hist .sel.volume{background:var(--pine-bg);color:var(--pine)}
.hist .t{flex:1;min-width:0}
.hist .t b{display:block;font-size:14.5px;font-weight:600}
.hist .t span{font-size:12.5px;color:var(--muted)}
.hist .n{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--muted);flex:none}
.vazio{color:var(--dim);font-size:14px;text-align:center;padding:20px 0;margin:0}

.seletor{margin:16px 18px 0}
.seg{display:flex;gap:5px;background:var(--card2);border-radius:11px;padding:5px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:9px 4px;color:var(--muted);cursor:pointer}
.seg button b{display:block;font-size:16px;font-weight:700}
.seg button span{display:block;font-size:10.5px;color:var(--dim);font-weight:500;margin-top:1px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.tipo button[aria-pressed="true"].p{background:var(--rust);color:#fff}
.seg.tipo button[aria-pressed="true"].v{background:var(--pine);color:#fff}
.seg.tipo button[aria-pressed="true"] span{color:rgba(255,255,255,.78)}
.seg+.seg{margin-top:7px}
.seg button:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}
.expl{font-size:12.5px;color:var(--muted);margin:9px 2px 0}
.seg.travado{opacity:.5}
.seg.travado button{cursor:not-allowed}
.travaAviso{margin:9px 2px 0;font-size:12.5px;color:var(--rust);background:var(--rust-bg);border-radius:8px;padding:8px 11px}

.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px}
.item.done{background:var(--card2);border-color:transparent}
.linha{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:27px;height:27px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px}
.tick::after{content:"";width:9px;height:5px;border-left:2.2px solid var(--pine);border-bottom:2.2px solid var(--pine);transform:rotate(-45deg) translateY(-1px);opacity:0}
.item.done .tick{border-color:var(--pine);background:var(--pine-bg)}
.item.done .tick::after{opacity:1}
.corpo{flex:1;min-width:0}
.nome{font-size:16.5px;font-weight:600;line-height:1.25;margin:0}
.item.done .nome{color:var(--muted)}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.m{font-family:"JetBrains Mono",monospace;font-size:11.5px;background:var(--card2);border-radius:6px;padding:3px 7px}
.m.k{background:var(--gold-bg);color:var(--gold)}
.m.s{color:var(--muted)}
.dica-btn{margin-top:9px;background:none;border:0;padding:0;color:var(--pine);font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.wrap{display:none;margin-top:10px}
.wrap.open{display:block}
.dica{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line2);padding-left:11px}
.dica+.dica{margin-top:9px}
.dica b{color:var(--ink);font-weight:600}
.dica.alerta{border-left-color:var(--rust);color:#8A3520;background:var(--rust-bg);padding:9px 11px;border-radius:0 8px 8px 0}

.bis{border:1.5px dashed var(--line2);border-radius:15px;padding:9px 9px 1px;margin-bottom:9px;background:rgba(29,94,79,.03)}
.rot-bis{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pine);margin:2px 0 8px 5px}

.series{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ant{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);margin:0 2px 8px}
.sh,.sr{display:grid;grid-template-columns:24px 1fr 1fr 36px;gap:7px;align-items:center}
.sh{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0 2px 5px}
.sr{margin-bottom:6px}
.sr .i{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--dim);text-align:center}
.campoCarga{min-width:0}
.conv{display:block;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--pine);text-align:center;margin-top:3px;min-height:13px}
.sh,.sr{align-items:start}
.sr .i{padding-top:11px}
.sr .ok{margin-top:0}
.sr input{width:100%;min-width:0;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:9px 4px;font-family:"JetBrains Mono",monospace;font-size:16px;text-align:center;color:var(--ink)}
.sr input::placeholder{color:#C6C0B6}
.sr input:focus{outline:0;border-color:var(--pine);background:var(--pine-bg)}
.sr .ok{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;padding:0;display:grid;place-items:center}
.sr .ok::after{content:"";width:8px;height:4.5px;border-left:2.2px solid var(--pine);border-bottom:2.2px solid var(--pine);transform:rotate(-45deg) translateY(-1px);opacity:.18}
.sr.feita .ok{background:var(--pine-bg);border-color:var(--pine)}
.sr.feita .ok::after{opacity:1}

.montagem{margin:13px 18px 0;background:var(--card2);border-radius:10px;padding:9px 12px}
.montagem summary{list-style:none;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.montagem summary::-webkit-details-marker{display:none}
.montagem summary::after{content:"ver";font-size:9.5px}
.montagem[open] summary::after{content:"ocultar"}
.montagem p{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);margin:8px 0 2px;line-height:1.65}
.acoes{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.yt{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line2);border-radius:7px;padding:4px 9px 4px 7px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.yt svg{width:15px;height:11px;flex:none}
.yt:hover{border-color:var(--rust);color:var(--rust)}
.dica-btn{margin-top:0}
.lixo{background:none;border:0;color:var(--dim);font-size:19px;line-height:1;padding:4px 6px;cursor:pointer;flex:none;border-radius:6px}
.lixo:hover{color:var(--rust);background:var(--rust-bg)}
.descartar{flex:none;background:none;border:1px solid var(--line2);border-radius:9px;padding:11px 12px;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer}
.modal{position:fixed;inset:0;z-index:60;background:rgba(21,24,28,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
#modal{z-index:90}
#editar,#mDados,#mResumo,#mCatalogo{z-index:60}
.modal.atras .modal-in{filter:brightness(.97)}
.modal-in{background:var(--card);border-radius:17px 17px 0 0;width:100%;max-width:660px;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
.modal-in h4{font-size:19px;font-weight:700;margin:0 0 8px}
.modal-in p{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.modal-in .bts{display:flex;gap:9px}
.modal-in button{flex:1;border:0;border-radius:11px;padding:14px;font-size:15.5px;font-weight:600;cursor:pointer}
.modal-in .no{background:var(--card2);color:var(--ink)}
.modal-in .si{background:var(--rust);color:#fff}
.campos2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.campos2 label{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.campos2 input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:11px 8px;font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--ink);text-align:center}
.campos2 input:focus{outline:0;border-color:var(--pine);background:var(--pine-bg)}
.modal-in.alto{max-height:88vh;overflow-y:auto}
.semanaSel{margin-bottom:12px}
.semanaSel button b{font-size:14px}
#rTexto{width:100%;height:44vh;border:1px solid var(--line2);border-radius:11px;padding:12px;font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.65;color:var(--ink);background:var(--card2);resize:none;margin-bottom:14px}
.seg.quatro button b{font-size:15px}
.btAdd{width:100%;background:var(--card);border:1.5px dashed var(--line2);border-radius:12px;padding:14px;font-size:15px;font-weight:600;color:var(--pine);cursor:pointer}
.removerEx{margin-top:10px;background:none;border:0;padding:4px 0;color:var(--rust);font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.catLista{max-height:52vh;overflow-y:auto;margin:4px -4px 0;padding:0 4px}
.grpCat{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:14px 0 7px}
.itemCat{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:0;border-radius:10px;padding:12px 13px;margin-bottom:6px;font-size:15px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer}
.itemCat span{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim);flex:none}
.customEx{display:flex;gap:7px}
.customEx input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:12px;font-size:16px;color:var(--ink)}
.customEx button{flex:none;background:var(--pine);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer}
.hist .sel.livre{background:var(--gold-bg);color:var(--gold)}
#dTexto,#dCola{width:100%;height:26vh;border:1px solid var(--line2);border-radius:11px;padding:12px;font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.55;color:var(--ink);background:var(--card2);resize:none;margin-bottom:13px}
#dArquivo{width:100%;margin-bottom:12px;font-size:14px}
.avisoImp{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.dStatus{font-size:13.5px;margin:0 0 12px;min-height:20px}
.dStatus.erro{color:var(--rust)}
.dStatus.ok{color:var(--pine)}
.btBackup{width:100%;margin-top:9px;background:none;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer}
.btResumo{width:100%;margin-top:12px;background:var(--ink);color:#fff;border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
.excluirSessao{width:100%;margin-top:11px;background:none;border:0;color:var(--rust);font-size:14px;font-weight:600;padding:11px;cursor:pointer}
.hist{cursor:pointer}
.doc{padding:4px 18px 0}
.doc h3{font-size:18px;font-weight:700;margin:24px 0 8px}
.doc h3:first-child{margin-top:10px}
.doc p{color:var(--muted);font-size:14.5px;margin:0 0 11px}
.doc b{color:var(--ink);font-weight:600}
.doc ul{margin:0 0 12px;padding-left:19px;color:var(--muted);font-size:14.5px}
.doc li{margin-bottom:5px}
.doc table{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:13.5px}
.doc th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line)}
.doc td{padding:9px 8px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top}
.doc td:first-child{color:var(--ink);font-weight:500}
.call{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:0 11px 11px 0;padding:13px 15px;margin:0 0 14px;font-size:14px;color:var(--muted)}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:11px 18px calc(11px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;display:none;gap:11px;align-items:center}
.barra.on{display:flex}
.prog{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pine);border-radius:3px;transition:width .2s}
.cont{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--muted);flex:none}
.clog{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.clog .modo{display:flex;gap:5px;background:var(--card2);border-radius:9px;padding:4px;margin-bottom:8px}
.clog .modo button{flex:1;background:none;border:0;border-radius:7px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.clog .modo button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.clog .campos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clog label{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.clog input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:9px 6px;font-family:"JetBrains Mono",monospace;font-size:16px;text-align:center;color:var(--ink)}
.clog input:focus{outline:0;border-color:var(--pine);background:var(--pine-bg)}
.metaCardio{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-top:9px}
.metaCardio .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.metaCardio .top b{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700}
.metaCardio .top span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.metaBar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.metaBar i{display:block;height:100%;background:var(--pine);border-radius:4px;transition:width .25s}
.metaBar i.cheio{background:var(--gold)}
.metaKm{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin-top:9px;line-height:1.7}
.metaKm b{color:var(--ink)}
.acao{flex:none;border:0;border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
.acao.fim{background:var(--rust)}

.desc{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--pine);color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;display:none;align-items:center;gap:14px}
.desc.on{display:flex}

  ok: true, mem: {},
  _t(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } },
  get(k){ if(!this.ok) return this.mem[k] ?? null;
    try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ this.ok=false; return this.mem[k] ?? null; } },
  set(k,v){ if(!this.ok){ this.mem[k]=v; return; }
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ this.ok=false; this.mem[k]=v; } }
};

const durTexto = m => { const h=Math.floor(m/60), r=m%60; return h ? h+'h'+String(r).padStart(2,'0') : m+' min'; };
function inicioSemana(d){ const x=new Date(d); const g=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-g); return x; }
const chaveEx = (l,n) => l+'|'+n;
const PLACA_MENOR = 4, PLACA_UN = 6.8;

const T_SERIE = 45, T_AQ = 10, T_CORE = 15, T_MOB = 12;
const T_CARDIO = { z2:25, int:20, sol:10 };
function estimaMusc(letra, volume){
  let seg = 0;
  BLOCOS[letra].forEach(b => {
    const rodadas = Math.max.apply(null, b.map(e => volume ? e.sv : e.sp));
    const desc = Math.max.apply(null, b.map(x=>x.d||0)) || 30;
    seg += rodadas * (b.length * T_SERIE + desc);
  });
  const cr = CORE_ROT[letra];
  seg += (volume ? cr.sv : cr.sp) * (T_SERIE + (cr.d || 45));
  return Math.round(seg / 60);
}
function estimaTotal(letra, volume, tipo){
  if(letra==='L') return 0;
  return T_AQ + estimaMusc(letra, volume) + T_CORE + T_MOB + T_CARDIO[CARDIO_POR[letra][tipo]];
}

function seriesHTML(letra, e, volume, descanso){

function telaTreino(){

      const ultimo=(i===b.length-1);
      const dEx=ultimo?dBloco:0;
      return item(e.n,[[(volume?e.sv:e.sp)+' × '+(volume?e.rv:e.rp)],[e.c,'k'],[dEx?dEx+' s':'sem pausa','s'],[e.r,'s']],
        e.dica,e.alerta,seriesHTML(letra,e,volume,dEx),e.n);
    }).join('');
    h+=b.length===2?`<div class="bis"><p class="rot-bis">Bisérie · sem descanso entre os dois</p>${c}</div>`:c;
  });
  h+=`</section><section class="sec"><h2>Core <span class="dur">15 min</span></h2>`;
  CORE_BASE.forEach(c=>h+=item(c[0],[[c[1],'k']],c[2],null,null,c[0]));
  const cr=CORE_ROT[letra];
  h+=item(cr.n,[[(volume?cr.sv:cr.sp)+' × '+(volume?cr.rv:cr.rp)],[cr.c,'k']],cr.dica,null,seriesHTML(letra,cr,volume),cr.n);
  h+=`</section><section class="sec"><h2>Mobilidade <span class="dur">12 min</span></h2>`;
  MOB.forEach(m=>h+=item(m[0],[[m[1],'k']],m[2],null,null,m[0]));
  const cd=CARDIO[CARDIO_POR[letra][sel.tipo]];
  const cl=(ativa&&ativa.cardio)||{};
  const formCardio=`<div class="clog">
    <div class="modo">
      <button data-mod="esteira" aria-pressed="${cl.mod==='esteira'}">Esteira</button>
      <button data-mod="bike" aria-pressed="${cl.mod!=='esteira'&&!!cl.mod}">Bike</button>
    </div>
    <div class="campos">
      <div><label>Minutos</label><input type="number" inputmode="numeric" id="cMin" placeholder="${cd[1].match(/\d+/)[0]}" value="${cl.min??''}"></div>
      <div><label>Distância (km)</label><input type="number" inputmode="decimal" step="0.1" id="cKm" placeholder="km" value="${cl.km??''}"></div>
    </div></div>`;
  h+=`</section><section class="sec"><h2>Cardio <span class="dur">${T_CARDIO[CARDIO_POR[letra][sel.tipo]]} min · depois da musculação</span></h2>`;
  h+=item(cd[0],[[cd[1],'k']],cd[2],null,formCardio,cd[0]+' treino');
  return h+`</section>`;
}

const APP_VERSAO = 9;

function montarBackup(){
  return {
    app: 'treino-glau',
    versao: APP_VERSAO,
    exportadoEm: new Date().toISOString(),
    totalSessoes: hist.length,
    hist: hist,
    ativa: ativa
  };
}

function resumoBackup(o){
  const h = (o && o.hist) || [];
  if(!h.length) return 'Nenhuma sessão.';
  const ds = h.map(x => x.data).sort((a,b)=>a-b);
  const min = h.reduce((a,x)=>a+(x.min||0),0);
  return h.length + ' sessões · ' + dtBR(ds[0]) + ' a ' + dtBR(ds[ds.length-1]) + ' · ' + durTexto(min) + ' de treino';
}

function validarBackup(txt){
  let o;
  try { o = JSON.parse(txt); }
  catch(e){ return { ok:false, msg:'O arquivo não é um JSON válido.' }; }
  if(!o || typeof o !== 'object') return { ok:false, msg:'Conteúdo inesperado.' };
  if(!Array.isArray(o.hist)) return { ok:false, msg:'Não encontrei a lista de sessões (campo "hist") neste arquivo.' };
  for(let i=0;i<o.hist.length;i++){
    const s = o.hist[i];
    if(!s || typeof s.data !== 'number' || !s.letra || !s.tipo)
      return { ok:false, msg:'A sessão ' + (i+1) + ' está incompleta. Arquivo recusado para não corromper seus dados.' };
    if(s.series && typeof s.series !== 'object')
      return { ok:false, msg:'As séries da sessão ' + (i+1) + ' estão em formato inesperado.' };
  }
  if(o.ativa && (typeof o.ativa.inicio !== 'number' || !o.ativa.letra))
    return { ok:false, msg:'A sessão em andamento do arquivo está incompleta.' };
  return { ok:true, dados:o };
}

function aplicarBackup(o, modo){
  if(modo === 'substituir'){
    hist = o.hist.slice();
    ativa = o.ativa || null;
  } else {
    const vistos = {};
    hist.forEach(s => vistos[s.data] = s);
    o.hist.forEach(s => { if(!vistos[s.data]) vistos[s.data] = s; });
    hist = Object.keys(vistos).map(k => vistos[k]);
  }
  hist.sort((a,b)=>a.data-b.data);
  const p = proximoDaFila();
  sel = ativa ? { letra:ativa.letra, tipo:ativa.tipo } : { letra:p[0], tipo:p[1] };
  salvar();
  if(typeof tickRelogio==='function'){
    if(ativa) tickRelogio();
    else { clearInterval(tRel); const r=document.getElementById('relogio'); if(r) r.classList.remove('on','pausado'); }
  }
}

function nomeArquivoBackup(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return 'treino-glau-backup-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
}

const META_EX = (()=>{
  const m = {};
  Object.keys(BLOCOS).forEach(L => BLOCOS[L].forEach(b => b.forEach(e => {
    m[chaveEx(L, e.n)] = { nome:e.n, letra:L, un:(e.maq?'placas':(e.un||'total')), maq:!!e.maq, sp:e.sp, sv:e.sv, rp:e.rp, rv:e.rv };
  })));
  Object.keys(CORE_ROT).forEach(L => { const e = CORE_ROT[L];
    m[chaveEx(L, e.n)] = { nome:e.n, letra:L, un:(e.un||'total'), maq:false, sp:e.sp, sv:e.sv, rp:e.rp, rv:e.rv };
  });
  return m;
})();
const topoFaixa = txt => { const n = String(txt||'').match(/\d+/g); return n ? +n[n.length-1] : null; };
const unLabel = u => ({ placas:'placas', mao:'kg/mão', lado:'kg/lado', total:'kg' })[u] || 'kg';

function melhorDaSerie(arr, maq){
  if(!arr) return null;
  let melhor = null;
  arr.forEach(s => {
    if(!s || !s.ok) return;
    const v = maq ? +s.pl : +s.kg;
    if(!isFinite(v)) return;
    if(!melhor || v > melhor.v) melhor = { v, reps:+s.reps || 0 };
  });
  return melhor;
}

function semanaDe(offset){
  const ini = inicioSemana(new Date());
  ini.setDate(ini.getDate() - 7*offset);
  const fim = new Date(ini); fim.setDate(fim.getDate() + 7);
  return { ini, fim, sessoes: hist.filter(h => new Date(h.data) >= ini && new Date(h.data) < fim).sort((a,b)=>a.data-b.data) };
}

function mapaCargas(sessoes){
  const m = {};
  sessoes.forEach(h => Object.keys(h.series || {}).forEach(k => {
    const meta = META_EX[k]; if(!meta) return;
    const best = melhorDaSerie(h.series[k], meta.maq);
    if(!best) return;
    if(!m[k] || best.v > m[k].v) m[k] = best;
  }));
  return m;
}

function prontosParaSubir(sessoes){
  const out = [];
  sessoes.forEach(h => Object.keys(h.series || {}).forEach(k => {
    const meta = META_EX[k]; if(!meta) return;
    const topo = topoFaixa(h.tipo === 'volume' ? meta.rv : meta.rp);
    const alvo = h.tipo === 'volume' ? meta.sv : meta.sp;
    if(!topo || !alvo) return;
    const feitas = (h.series[k] || []).filter(s => s && s.ok && +s.reps > 0);
    if(feitas.length >= alvo && feitas.every(s => +s.reps >= topo)){
      const v = meta.maq ? feitas[0].pl : feitas[0].kg;
      if(!out.some(o => o.k === k)) out.push({ k, nome:meta.nome, v, un:unLabel(meta.un), topo });
    }
  }));
  return out;
}

function dtBR(ts, comHora){
  const d = new Date(ts);
  const s = d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
  return comHora ? s + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : s;
}
const DIA3 = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  L.push('');

  L.push('SESSÕES (' + S.length + ' de 6 previstas)');
  if(!S.length) L.push('  Nenhuma sessão registrada.');
  S.forEach(h => {
    L.push('  ' + DIA3[new Date(h.data).getDay()] + ' ' + dtBR(h.data) + ' · ' + h.letra + ' ' + NOMES[h.letra] +
      ' (' + (h.tipo === 'pesado' ? 'Pesado' : 'Volume') + ') · ' + durTexto(h.min || 0) +
      (h.volumeTotal ? ' · volume ' + Math.round(h.volumeTotal).toLocaleString('pt-BR') + ' kg' : ''));
  });
  const tot = todas.reduce((x,h)=>x+(h.min||0), 0);
  const volA = todas.reduce((x,h)=>x+(h.volumeTotal||0), 0);
  const volB = b.sessoes.reduce((x,h)=>x+(h.volumeTotal||0), 0);
  if(todas.length){
    L.push('  Tempo total: ' + durTexto(tot) + ' · média ' + durTexto(Math.round(tot/todas.length)));
    L.push('  Volume total: ' + Math.round(volA).toLocaleString('pt-BR') + ' kg' +
      (volB ? ' (semana anterior: ' + Math.round(volB).toLocaleString('pt-BR') + ' kg · ' +
        (volA>=volB?'+':'') + Math.round((volA/volB-1)*100) + '%)' : ''));
  }
  L.push('');
  if(LV.length){
    L.push('');
    L.push('TREINOS LIVRES (' + LV.length + ')');
    LV.forEach(h => L.push('  ' + DIA3[new Date(h.data).getDay()] + ' ' + dtBR(h.data) + ' · ' + durTexto(h.min||0) +
      ' · ' + Object.keys(h.series||{}).length + ' exercício(s)' +
      (h.volumeTotal ? ' · volume ' + Math.round(h.volumeTotal).toLocaleString('pt-BR') + ' kg' : '')));
  }
  if(LV.length) L.push('');

  const c = todas.map(h=>h.cardio).filter(Boolean);

  const bk = c.filter(x=>x.mod==='bike').reduce((x,y)=>x+(+y.km||0), 0);
  L.push('CARDIO');
  L.push('  ' + mn + ' de ' + META_CARDIO + ' min (' + Math.round(mn/META_CARDIO*100) + '% da meta)');
  if(est) L.push('  Esteira: ' + est.toFixed(1).replace('.',',') + ' km');
  if(bk) L.push('  Bike: ' + bk.toFixed(1).replace('.',',') + ' km');
  L.push('');

  const mA = mapaCargas(todas), mB = mapaCargas(b.sessoes);
  const sub = [], man = [], cai = [], nov = [];
  Object.keys(mA).forEach(k => {
    const meta = META_EX[k]; if(!meta) return;
    const u = unLabel(meta.un);
    const txt = meta.nome + ': ';
    if(!mB[k]) nov.push('  ' + txt + mA[k].v + ' ' + u);
    else if(mA[k].v > mB[k].v) sub.push('  ' + txt + mB[k].v + ' → ' + mA[k].v + ' ' + u);
    else if(mA[k].v < mB[k].v) cai.push('  ' + txt + mB[k].v + ' → ' + mA[k].v + ' ' + u);
    else man.push('  ' + txt + mA[k].v + ' ' + u + ' (' + mA[k].reps + ' reps)');
  });
  L.push('CARGAS vs SEMANA ANTERIOR');
  if(sub.length){ L.push(' Subiram (' + sub.length + '):'); sub.forEach(x=>L.push(x)); }
  if(man.length){ L.push(' Mantiveram (' + man.length + '):'); man.forEach(x=>L.push(x)); }
  if(cai.length){ L.push(' Caíram (' + cai.length + '):'); cai.forEach(x=>L.push(x)); }
  if(nov.length){ L.push(' Sem comparação (' + nov.length + '):'); nov.forEach(x=>L.push(x)); }
  if(!sub.length && !man.length && !cai.length && !nov.length) L.push('  Nenhuma carga registrada.');
  L.push('');

  const prontos = prontosParaSubir(S);
  L.push('PRONTOS PARA SUBIR CARGA');
  if(prontos.length) prontos.forEach(p => L.push('  ' + p.nome + ' — topo da faixa (' + p.topo + ' reps) atingido com ' + p.v + ' ' + p.un));
  else L.push('  Nenhum exercício bateu o topo da faixa em todas as séries.');
  L.push('');

  L.push('OBSERVAÇÕES');
  const obs = [];
  ['A','B','C'].forEach(l => {
    const n = S.filter(h=>h.letra===l).length;
    if(n < 2) obs.push('Treino ' + l + ' (' + NOMES[l] + ') feito ' + n + 'x — o previsto é 2x por semana.');
  });
  if(mn < META_CARDIO) obs.push('Cardio ' + (META_CARDIO-mn) + ' min abaixo da meta semanal.');
  if(volB && volA < volB*0.9) obs.push('Volume caiu mais de 10% em relação à semana anterior.');
  if(volB && volA > volB*1.3) obs.push('Volume subiu mais de 30% — atenção à recuperação.');
  if(cai.length) obs.push(cai.length + ' exercício(s) com carga menor que na semana anterior.');
  if(S.length >= 6 && mn >= META_CARDIO) obs.push('Semana completa: 6 sessões e meta de cardio batida.');
  if(!obs.length) obs.push('Nada fora do esperado.');
  obs.forEach(o => L.push('  - ' + o));
  L.push('');
  L.push('Gerado em ' + dtBR(Date.now(), true));
  return L.join('\n');
}

function iniciar(){
  ativa={letra:sel.letra,tipo:sel.tipo,inicio:Date.now(),acumulado:0,pausado:null,series:{},feitos:[],livres:[]};
  salvar(); tickRelogio(); irPara(1);
}
function decorridoSeg(){
  if(!ativa) return 0;
  const fim = ativa.pausado || Date.now();
  return Math.max(0, Math.floor((fim - ativa.inicio - (ativa.acumulado||0)) / 1000));
}
function tickRelogio(){
  clearInterval(tRel);
  if(!ativa){ relogio.classList.remove('on','pausado'); return; }
  relogio.classList.add('on');
  relogio.classList.toggle('pausado', !!ativa.pausado);
  const upd=()=>{ document.getElementById('relN').textContent = mmss(decorridoSeg()); };
  upd();
  if(!ativa.pausado) tRel=setInterval(upd,1000);
}
relogio.onclick=()=>{
  if(!ativa) return;
  if(ativa.pausado){ ativa.acumulado=(ativa.acumulado||0)+(Date.now()-ativa.pausado); ativa.pausado=null; }
  else { ativa.pausado=Date.now(); }
  salvar(); tickRelogio();
};
function encerrar(){
  const min=Math.max(1,Math.round(decorridoSeg()/60));
  let vol=0;
  Object.keys(ativa.series).forEach(k=>{
    const meta=META_EX[k];
    const f=meta ? (FATOR[meta.un]||1) : 1;
    (ativa.series[k]||[]).forEach(s=>{ if(s&&s.ok) vol+=(+s.kg||0)*(+s.reps||0)*f; });
  });
  hist.push({data:ativa.inicio,letra:ativa.letra,tipo:ativa.tipo,min,series:ativa.series,volumeTotal:vol,cardio:ativa.cardio||null});
  ativa=null; salvar(); clearInterval(tRel); relogio.classList.remove('on','pausado');
  sel={letra:proximoDaFila()[0],tipo:proximoDaFila()[1]};
  irPara(0);
}

    confirmar('Remover exercício?','<b>'+nome+'</b> sai desta sessão junto com as séries registradas nele.','Remover',()=>{
      const k=ativa.livres[i].custom?chaveEx('L',nome):chaveEx(ativa.livres[i].orig,nome);
      delete ativa.series[k];
      ativa.feitos=ativa.feitos.filter(x=>x!==nome);
      ativa.livres.splice(i,1); salvar(); irPara(1); });
    return; }
  const md=ev.target.closest('[data-mod]');
  if(md){

    ativa.cardio=ativa.cardio||{};

    md.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===md?'true':'false'));

  const d=ev.target.closest('.dica-btn');
  if(d){ const w=document.getElementById(d.dataset.alvo); d.textContent=w.classList.toggle('open')?'Fechar':'Como fazer'; return; }
  const t=ev.target.closest('.tick');

    if(ativa){ const nm=it.dataset.nome; ativa.feitos=ativa.feitos.filter(x=>x!==nm); if(on) ativa.feitos.push(nm); salvar(); }

  const ok=ev.target.closest('.ok');

    if(!ativa){ alert('Toque em "Iniciar treino" na barra de baixo para registrar as séries.'); return; }
    const feita=sr.classList.toggle('feita');
    if(feita){
      const maq=sr.dataset.maq==='1';
      const cCar=sr.querySelector(maq?'[data-c="pl"]':'[data-c="kg"]');
      const cRep=sr.querySelector('[data-c="reps"]');
      const nome=sr.dataset.ex.split('|')[1];
      const ant=ultimoRegistro(sr.dataset.ex.split('|')[0], nome);
      const ref=ant && ant[+sr.dataset.i];
      if(ref){
        if(cCar.value==='') cCar.value = maq ? (ref.pl??'') : (ref.kg??'');
        if(cRep.value==='') cRep.value = ref.reps??'';
      }
    }
    gravarSerie(sr);
    sincronizarItem(sr.closest('.item'));
    if(feita && +ok.dataset.rest>0) comecarDescanso(+ok.dataset.rest); }
});

function sincronizarItem(it){
  if(!it||!ativa) return;
  const linhas=[...it.querySelectorAll('.sr')];
  if(!linhas.length) return;
  const todas=linhas.every(l=>l.classList.contains('feita'));
  const jaFeito=it.classList.contains('done');
  if(todas!==jaFeito){
    it.classList.toggle('done',todas);
    const nm=it.dataset.nome;
    ativa.feitos=ativa.feitos.filter(x=>x!==nm);
    if(todas) ativa.feitos.push(nm);
    salvar();
  }
  atualizarBarra();
}
function gravarSerie(sr){
  if(!ativa) return;
  const k=sr.dataset.ex, i=+sr.dataset.i, maq=sr.dataset.maq==='1';
  const campo=sr.querySelector(maq?'[data-c="pl"]':'[data-c="kg"]');
  const reps=sr.querySelector('[data-c="reps"]').value;
  ativa.series[k]=ativa.series[k]||[];
  if(maq){
    const pl=campo.value;
    const conv=sr.querySelector('.conv');
    if(conv) conv.textContent = pl!=='' ? fmtKg(kgPlacas(+pl)) : '';
    ativa.series[k][i]={ pl, kg: pl!=='' ? +kgPlacas(+pl).toFixed(1) : '', reps, ok:sr.classList.contains('feita') };
  } else {
    ativa.series[k][i]={ kg:campo.value, reps, ok:sr.classList.contains('feita') };
  }
  salvar();
}

function aplicar(modo){
  if(!importado){ status('Nenhum backup válido carregado ainda.','erro'); return; }
  const o=importado;
  const txt = modo==='substituir'
    ? 'Todo o histórico deste aparelho será <b>apagado e substituído</b> por: '+resumoBackup(o)+'. Isso não pode ser desfeito.'
    : 'As sessões do arquivo serão somadas às deste aparelho. Sessões com a mesma data e hora não são duplicadas.';

    aplicarBackup(o, modo);
    mDados.classList.remove('on');
    irPara(0);
  });
}
document.getElementById('dSubstituir').onclick=()=>aplicar('substituir');
document.getElementById('dMesclar').onclick=()=>aplicar('mesclar');

function ajustaTopo(){
  const t=document.querySelector('.topo'), a=document.querySelector('.app');
  if(t&&a) a.style.paddingTop=t.offsetHeight+'px';
}
ajustaTopo();
window.addEventListener('resize',ajustaTopo);
window.addEventListener('orientationchange',()=>setTimeout(ajustaTopo,150));

irPara(0);

/* iOS ignora user-scalable=no, então a pinça é bloqueada por evento */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
});
document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length > 1) e.preventDefault();
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
